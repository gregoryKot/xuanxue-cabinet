  <path
    d="M50,2 A48,48 0 0 1 50,98 A24,24 0 0 1 50,50 A24,24 0 0 0 50,2 Z"
    fill="#1f3b2f"
  />
  <circle cx="50" cy="26" r="8" fill="#1f3b2f" />
  <circle cx="50" cy="74" r="8" fill="#e7e5e2" />
  <circle cx="50" cy="50" r="48" fill="none" stroke="#1f3b2f" stroke-width="2" />
</svg>
