<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Печать школы Сюань-Сюэ">
  <!--
    Исходник PWA-иконки (направление «Тёплая школа», docs/adr/0043, заменил
    ADR-0031; CLAUDE.md «Одна механика — один компонент»): та же печать, что
    SchoolMark.tsx в шапке кабинета — квадрат терракотой со светлой обводкой
    бумагой на фоне-бумаге. Знак на входе, в кабинете и на иконке
    установленного приложения обязан совпадать, иначе человек не узнаёт то же
    место. Цвета — токены палитры (paper и terracotta) из web/src/index.css:
    в XML-комментарии их нельзя написать с двумя дефисами, сверяет их
    scripts/check-pwa.mjs. Никакого <text>: sharp в CI-контейнере
    рендерит без CJK-шрифтов, символ — только rect. Перегенерировать
    растровые иконки:
      node scripts/generate-pwa-icons.mjs
  -->
  <rect width="100" height="100" rx="14" fill="#f4f1ea" />
  <rect x="18" y="18" width="64" height="64" rx="9" fill="#b35a38" stroke="#f4f1ea" stroke-width="6" />
</svg>
