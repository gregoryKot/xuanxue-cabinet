<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Печать школы Сюань-Сюэ">
  <!--
    Исходник PWA-иконки (ADR-0031, CLAUDE.md «Одна механика — один
    компонент»): та же печать, что SchoolMark.tsx в шапке кабинета — квадрат
    киноварью со светлой обводкой бумагой на фоне-бумаге. Знак на входе,
    в кабинете и на иконке установленного приложения обязан совпадать, иначе
    человек не узнаёт то же место. Никакого <text>: sharp в CI-контейнере
    рендерит без CJK-шрифтов, символ — только rect. Перегенерировать
    растровые иконки:
      node scripts/generate-pwa-icons.mjs
  -->
  <rect width="100" height="100" rx="14" fill="#faf8f4" />
  <rect x="18" y="18" width="64" height="64" rx="9" fill="#9c4221" stroke="#faf8f4" stroke-width="6" />
</svg>
