version: 2
updates:
  # Корневой package-lock.json покрывает все npm-workspaces (shared, api, web).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    ignore:
      # Драйвер mongodb в api пинится под версию, которую тянет Mongoose (~7.5):
      # отдельный бамп даёт две копии драйвера и ломает типы Db в tsc (PR #6, #10).
      # Обновляется вместе с mongoose.
      - dependency-name: 'mongodb'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
      major:
        update-types: ['major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
