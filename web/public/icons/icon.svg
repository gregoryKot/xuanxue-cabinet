<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Тайцзи">
  <!--
    Исходник PWA-иконки (ADR-0006, CLAUDE.md «Приложение на телефоне»).
