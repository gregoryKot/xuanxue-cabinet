<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Знак школы Сюань-Сюэ">
  <!--
    Исходник PWA-иконки (ADR-0006, CLAUDE.md «Приложение на телефоне»).
    Знак — печать киноварью, тот же, что в шапке кабинета
    (web/src/app/AppShell.tsx), с вырезанным в ней тайцзи: направление «тихо и
    благородно», docs/adr/0031-visual-direction-quiet-and-noble.md.
    Тёмная половина тайцзи — сама киноварь печати, поэтому круг обведён
    бумагой: без обводки на иконке 48 dp окружность пропадает и фигура
    читается пятном.
    Никакого <text>: sharp в CI-контейнере рендерит без CJK-шрифтов, поэтому
    символ — только path/circle. Перегенерировать растровые иконки:
      node scripts/generate-pwa-icons.mjs
  -->
  <rect width="100" height="100" rx="12" fill="#9c4221" />
  <circle cx="50" cy="50" r="32" fill="#faf8f4" />
  <path
    d="M50,18 A32,32 0 0 1 50,82 A16,16 0 0 1 50,50 A16,16 0 0 0 50,18 Z"
    fill="#9c4221"
  />
  <circle cx="50" cy="34" r="5.3" fill="#9c4221" />
  <circle cx="50" cy="66" r="5.3" fill="#faf8f4" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="#faf8f4" stroke-width="2.5" />
</svg>
