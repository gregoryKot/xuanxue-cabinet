          '<circle cx="7" cy="13" r="3"/><circle cx="17" cy="13" r="3"/><path d="M10 13h4"/>',
        ),
        note: sv(
          '<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 14l2-3 2 3 2-3 2 3"/>',
        ),
        phone: sv(
          '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M12 9v6M9 12h6"/>',
        ),
      };
      const status = (and) =>
        `<div class="status ${and ? 'and' : ''}"><span>9:41</span><span class="isl"></span><u><q></q><s></s></u></div>`;
      const page = `<div class="page"><div class="pgh"><img src="${MARK}">Сюань-Сюэ</div><div class="pgt">Ближайшее занятие</div><div class="bar" style="width:86%"></div><div class="bar" style="width:64%"></div><div class="card"><div class="bar" style="width:52%"></div><div class="bar" style="width:80%"></div><div class="bar" style="width:38%"></div></div><div class="card"><div class="bar" style="width:70%"></div><div class="bar" style="width:46%"></div></div><div class="btn"></div></div>`;
      const ic = (k, id, st = '') =>
        `<div class="ico" ${id ? `id="${id}"` : ''} style="${st}">${I[k]}</div>`;
      const shead = `<div class="shead"><img src="${ICON}"><div><b>Сюань-Сюэ</b><span>xuanxue.su</span></div></div>`;
      const gh = (x) =>
        `<div class="gh"><div class="th"><img src="${ICON}"></div><div><b>Сюань-Сюэ</b><span>xuanxue.su</span><br><span class="opt">Параметры ›</span></div>${x ? '<div class="x">✕</div>' : ''}</div>`;
      const act = (k, l, id) =>
        `<div class="act"><i ${id ? `id="${id}"` : ''}>${I[k]}</i>${l}</div>`;
      const iosMenu = (id) =>
        `<div class="menu up" style="bottom:78px;right:12px;width:236px;border-radius:22px"><div class="row" id="${id}">${I.share}Поделиться</div><div class="row">${I.book}Закладки</div><div class="row">${I.tabs}Все вкладки</div></div>`;
      const iosShare = (id) =>
        `<div class="gl">${gh()}<div class="rw"><i></i><i></i><i></i><i></i><i></i></div><div class="rw aps"><i></i><i></i><i></i><i></i><i></i></div><div class="acts4">${act('copy', 'Скопировать')}${act('print', 'Напечатать')}${act('mark', 'В закладки')}${act('chev', 'Ещё', id)}</div></div>`;
      const iosMore = (id) =>
        `<div class="gl tall">${gh(1)}<div class="acts4">${act('copy', 'Скопировать')}${act('print', 'Напечатать')}${act('mark', 'В закладки')}${act('chevu', 'Свернуть')}</div><div class="lg"><div class="row">${I.glasses}В список для чтения</div><div class="row">${I.book}Добавить закладку в…</div><div class="row">${I.star}Добавить в Избранное</div><div class="row">${I.note}В быструю заметку</div><div class="row">${I.find}Найти на странице</div><div class="row" id="${id}">${I.addsq}На экран «Домой»</div></div></div>`;
      const iosConfirm = (id) =>
        `<div class="gl tall" style="top:150px"><div class="nav" style="padding:0 4px"><a style="color:#24281f">✕</a><b>На экран «Домой»</b><a class="go" id="${id}">Добавить</a></div><div class="lg" style="padding:14px 16px">${shead.replace('class="shead"', 'class="shead" style="margin:0"')}</div><div class="lg"><div class="row">Открыть как веб-приложение<span class="tg"></span></div></div></div>`;
      const andMenu = (label, up, k) =>
        `<div class="menu ${up ? 'up' : ''}"><div class="row">${I.plus}Новая вкладка</div><div class="row">${I.clock}История</div><div class="row">${I.down}Загрузки</div><div class="row">${I.star}Закладки</div><div class="row" id="t2">${I[k]}${label}</div><div class="row">${I.gear}Настройки</div></div>`;
      const andDialog = (title, go) =>
        `<div class="dialog"><h4>${title}</h4>${shead}<div class="acts"><a>Отмена</a><a class="go" id="t3">${go}</a></div></div>`;
      const crMenu = (id) =>
        `<div class="menu cr">` +
        [
          ['clock', 'История'],
          ['copy', 'Удалить данные о работе в браузере'],
          ['gear', 'Настройки сайта'],
          0,
          ['down', 'Скачанные файлы'],
          ['star', 'Закладки'],
          ['tabs', 'Недавние вкладки'],
          0,
          ['share', 'Поделиться…'],
          ['find', 'Найти на странице'],
          ['note', 'Перевести…'],
          ['fwd', 'Озвучить эту страницу'],
          ['book', 'Перейти в Режим чтения'],
          ['down', 'Установить и создать ярлык', id],
          ['phone', 'Версия для ПК'],
          0,
          ['gear', 'Настройки'],
          ['find', 'Справка/отзыв'],
        ]
          .map((r) =>
            r
              ? `<div class="row" ${r[2] ? `id="${r[2]}"` : ''}>${I[r[0]]}${r[1]}</div>`
              : '<hr>',
          )
          .join('') +
        `</div>`;
      const crChoice = (id) =>
        `<div class="dialog" style="top:250px"><h4>Добавить на главный экран</h4>${shead}<div class="group" style="border:1px solid #e3e0ea"><div class="row" id="${id}" style="justify-content:flex-start;gap:14px">${I.down}Установить</div><div class="row" style="justify-content:flex-start;gap:14px">${I.addsq}Создать ярлык</div></div></div>`;
      const C = {
        'ios-safari': {
          name: 'Safari на iPhone',
          badge: '#1a8cff',
          os: 'ios',
          chrome:
            status() +
            page +
            `<div class="fbar">${ic('back')}<div class="pill">xuanxue.su</div>${ic('dots', 't1')}</div>`,
          ov: [iosMenu('t2'), iosShare('t3'), iosMore('t4'), iosConfirm('t5')],
          steps: [
            ['Кнопка «⋯» рядом с адресом', ''],
            ['В меню — «Поделиться»', ''],
            ['Круглая кнопка со стрелкой вниз', 'Она раскрывает полный список'],
            ['В списке — «На экран „Домой“»', ''],
            ['«Добавить» справа вверху', ''],
          ],
        },
        'ios-chrome': {
          name: 'Chrome на iPhone',
          badge: '#e8a100',
          os: 'ios',
          chrome:
            status() +
            `<div class="topbar"><div class="pill" style="justify-content:space-between;padding-left:40px">xuanxue.su${ic('share', 't1', 'color:#007aff')}</div></div>` +
            page +
            `<div class="bottom"><div class="tools" style="margin:0;color:#5f6368">${ic('back')}${ic('fwd', '', 'opacity:.35')}${ic('plus')}<div class="ico"><div class="tabs">1</div></div>${ic('dots')}</div></div>`,
          ov: [iosShare('t2'), iosMore('t3'), iosConfirm('t4')],
          steps: [
            ['«Поделиться» — справа в адресной строке', 'Квадрат со стрелкой вверх'],
            ['Круглая кнопка со стрелкой вниз', 'Она раскрывает полный список'],
            ['В списке — «На экран „Домой“»', ''],
            ['«Добавить» справа вверху', ''],
          ],
        },
        'android-chrome': {
          name: 'Chrome на Android',
          badge: '#1e9e52',
          os: 'and',
          chrome:
            status(1) +
            `<div class="topbar">${ic('home')}<div class="pill" style="justify-content:flex-start;padding-left:14px;border-radius:21px">xuanxue.su</div>${ic('plus')}<div class="ico"><div class="tabs">1</div></div>${ic('vdots', 't1')}</div>` +
            page,
          ov: [
            crMenu('t2'),
            crChoice('t3'),
            andDialog('Установить приложение', 'Установить').replace(
              'id="t3"',
              'id="t4"',
            ),
          ],
          steps: [
            ['Меню ⋮ справа вверху', ''],
            ['«Установить и создать ярлык»', 'Меню длинное — пролистать вниз'],
            ['Выбрать «Установить»', '«Создать ярлык» тоже подойдёт'],
            ['Подтвердить — «Установить»', ''],
          ],
        },
        'android-yandex': {
          name: 'Яндекс Браузер на Android',
          badge: '#fc3f1d',
          os: 'and',
          chrome:
            status(1) +
            page +
            `<div class="bottom" style="display:flex;align-items:center;gap:6px;padding:10px 10px 16px"><div class="pill"><b style="color:#fc3f1d">Я</b>xuanxue.su</div><div class="ico"><div class="tabs">1</div></div>${ic('vdots', 't1')}</div>`,
          ov: [
            andMenu('Добавить ярлык на телефон', 1, 'phone'),
            andDialog('Добавить на главный экран', 'Добавить'),
          ],
          steps: [
            ['Меню ⋮ рядом с адресной строкой', ''],
            ['В меню — «Добавить ярлык на телефон»', ''],
            ['Подтвердить — «Добавить»', ''],
          ],
        },
      }[B];
      const N = C.steps.length,
        S0 = 1500,
        SD = 2600,
        st = C.steps.map((_, i) => S0 + i * SD),
        tap = st.map((t) => t + 2050),
        done = S0 + N * SD,
        T = { total: done + 2900 };
      const seq = (p, n = N) =>
        Array.from(
          { length: n },
          (_, i) =>
            `<div class="${p === 'r' ? 'ring' : p === 'p' ? 'ripple' : ''}" id="${p}${i + 1}"></div>`,
        ).join('');
      const tiles = (n) =>
        Array.from(
          { length: n },
          () => '<div class="app"><i></i><span></span></div>',
        ).join('');
      const cap = (k, s, b, e) =>
        `<div class="cap" id="c${k}"><small>${s}</small><b>${b}</b>${e ? `<em>${e}</em>` : ''}</div>`;
      document.body.innerHTML = `
<div class="chip"><i style="background:${C.badge}"></i>${C.name}</div>
${cap(0, 'Значок на экран', 'Сайт открывается как приложение', 'Меньше минуты — и значок на экране')}
${C.steps.map((x, i) => cap(i + 1, `Шаг ${i + 1} из ${N}`, x[0], x[1])).join('')}
${cap(N + 1, 'Готово', 'Значок рядом с приложениями', 'Открывается в одно касание')}
<div class="phone" id="phone"><div class="screen">
 <div class="layer">${C.chrome}</div>
 <div class="layer dim" id="dim"></div>
 ${C.ov.map((h, i) => `<div class="layer" id="o${i + 1}">${h}</div>`).join('')}
 <div class="layer home ${C.os === 'and' ? 'and-home' : ''}" id="home">${status(C.os === 'and')}<div class="grid">${tiles(9)}<div class="app me" id="me"><img src="${ICON}"><span>Сюань-Сюэ</span></div></div><div class="dock"><i></i><i></i><i></i><i></i></div></div>
</div></div>
${seq('r')}<div class="ring" id="rH"></div>${seq('p')}
<div class="finger" id="finger"></div>
<div class="dots">${Array.from({ length: N }, (_, i) => `<i id="d${i + 1}"></i>`).join('')}</div>`;
      const $ = (id) => document.getElementById(id);
      const E = 'cubic-bezier(.2,.8,.2,1)';
      function A(el, fr) {
        const k = fr.map(([t, p, e]) => ({
          offset: Math.min(t, T.total) / T.total,
          ...p,
          easing: e || E,
        }));
        if (k[0].offset > 0) k.unshift({ ...k[0], offset: 0 });
        if (k.at(-1).offset < 1) k.push({ ...k.at(-1), offset: 1 });
        el.animate(k, {
          duration: T.total,
          fill: 'both',
          iterations: REC ? 1 : Infinity,
        });
      }
      function build() {
        const tg = st.map((_, i) => $('t' + (i + 1)).getBoundingClientRect()),
          me = $('me').querySelector('img').getBoundingClientRect();
        const on = { opacity: 1, transform: 'none' };
        [[0, S0], ...st.map((t) => [t, t + SD]), [done, T.total + 400]].forEach(
          ([a, b], k) =>
            A($('c' + k), [
              [
                Math.max(a - 1, 0),
                { opacity: k ? 0 : 1, transform: k ? 'translateY(14px)' : 'none' },
              ],
              [a + 320, on],
              [b - 220, on],
              [b, { opacity: b > T.total ? 1 : 0, transform: 'none' }],
            ]),
        );
        A($('phone'), [
          [0, { opacity: 0, transform: 'translateY(50px) scale(.96)' }],
          [700, on],
        ]);
        const sh = (e) => e.matches('.sheet,.gl');
        C.ov.forEach((_, i) => {
          const el = $('o' + (i + 1)).firstElementChild,
            pv = i && $('o' + i).firstElementChild,
            out = tap[i + 1] + 150;
          const k = sh(el)
            ? pv && sh(pv)
              ? { opacity: 0, transform: 'translateY(40px)' }
              : { opacity: 1, transform: 'translateY(105%)' }
            : { opacity: 0, transform: 'scale(.86)' };
          A(el, [
            [tap[i] + 150, k],
            [st[i + 1], on],
            [out, on],
            [out + 250, { opacity: 0, transform: 'none' }],
          ]);
        });
        A($('dim'), [
          [tap[0] + 150, { opacity: 0 }],
          [st[1], { opacity: 1 }],
          [tap[N - 1] + 150, { opacity: 1 }],
          [tap[N - 1] + 450, { opacity: 0 }],
        ]);
        A($('home'), [
          [tap[N - 1] + 200, { opacity: 0, transform: 'scale(1.06)' }],
          [done, on],
        ]);
        A($('me'), [
          [done + 150, { opacity: 0, transform: 'scale(.2)' }],
          [done + 520, { opacity: 1, transform: 'scale(1.18)' }],
          [done + 800, { opacity: 1, transform: 'scale(1)' }],
        ]);
        const ring = (el, r, a, b, p = 7) => {
          Object.assign(el.style, {
            left: r.left - p + 'px',
            top: r.top - p + 'px',
            width: r.width + 2 * p + 'px',
            height: r.height + 2 * p + 'px',
            borderRadius: (r.width < 80 ? 999 : 16) + 'px',
          });
          const f = [
            [a, { opacity: 0, transform: 'scale(1.25)' }],
            [a + 350, { opacity: 1, transform: 'scale(1)' }],
          ];
          for (let t = a + 350, i = 0; t + 450 < b; t += 450, i++)
            f.push([
              t + 450,
              { opacity: 1, transform: i % 2 ? 'scale(1)' : 'scale(1.06)' },
              'ease-in-out',
            ]);
          f.push(
            [b, { opacity: 1, transform: 'scale(1)' }],
            [b + 200, { opacity: 0, transform: 'scale(1)' }],
          );
          A(el, f);
        };
        tg.forEach((r, i) => ring($('r' + (i + 1)), r, st[i] + 550, tap[i]));
        const rH = $('rH');
        ring(rH, me, done + 900, T.total - 500, 4);
        rH.style.borderRadius = C.os === 'and' ? '999px' : '22px';
        rH.style.borderColor = '#fff';
        rH.style.boxShadow = '0 0 0 8px rgba(255,255,255,.25)';
        const P = tg.map((r) => [r.left + r.width / 2, r.top + r.height / 2]),
          tr = (p, s = 1) => ({
            transform: `translate(${p[0]}px,${p[1] + 34}px) scale(${s})`,
          });
        const start = [600, 1180],
          f = [[S0 + 500, { opacity: 0, ...tr(start) }]];
        P.forEach((p, i) => {
          f.push(
            [st[i] + 800, { opacity: i ? 1 : 0, ...tr(i ? P[i - 1] : start) }],
            [tap[i] - 380, { opacity: 1, ...tr(p) }],
            [tap[i] - 120, { opacity: 1, ...tr(p) }],
            [tap[i], { opacity: 1, ...tr(p, 0.8) }],
            [tap[i] + 180, { opacity: 1, ...tr(p) }],
          );
        });
        f.push([tap[N - 1] + 500, { opacity: 0, ...tr(P[N - 1]) }]);
        f.splice(2, 0, [
          S0 + 1150,
          { opacity: 1, ...tr([(start[0] + P[0][0]) / 2, (start[1] + P[0][1]) / 2]) },
        ]);
        A($('finger'), f);
        P.forEach((p, i) => {
          const el = $('p' + (i + 1));
          el.style.left = p[0] + 'px';
          el.style.top = p[1] + 'px';
          A(el, [
            [0, { opacity: 0, transform: 'scale(.5)' }],
            [tap[i] - 1, { opacity: 0, transform: 'scale(.5)' }],
            [tap[i], { opacity: 0.9, transform: 'scale(.5)' }],
            [tap[i] + 520, { opacity: 0, transform: 'scale(2.3)' }],
          ]);
        });
        st.forEach((t, i) =>
          A($('d' + (i + 1)), [
            [t, { width: '10px', background: '#d6cfc2' }],
            [t + 300, { width: '34px', background: '#b35a38' }],
            [t + SD, { width: '34px', background: '#b35a38' }],
            [t + SD + 300, { width: '10px', background: '#b35a38' }],
          ]),
        );
        window.seek = (t) => {
          document.getAnimations().forEach((a) => {
            a.pause();
            a.currentTime = t;
          });
          return new Promise((r) =>
            requestAnimationFrame(() => requestAnimationFrame(r)),
          );
        };
        window.TIMES = { total: T.total, done, taps: tap };
        window.TOTAL = T.total;
        window.ready = true;
      }
      Promise.all([
        ...['400 34px', '500 50px'].map((f) =>
          document.fonts.load(f + ' "Cormorant Garamond"', 'Шаг a'),
        ),
        ...['500 20px', '700 20px'].map((f) =>
          document.fonts.load(f + ' "Golos Text"', 'Шаг a'),
        ),
        ...[...document.images].map((i) => i.decode().catch(() => {})),
      ]).then(build);
    </script>
  </body>
