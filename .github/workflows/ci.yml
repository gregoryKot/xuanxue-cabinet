name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  # Версия бинаря mongod для mongodb-memory-server — зафиксирована явно, а
  # не оставлена на дефолт библиотеки: иначе апдейт mongodb-memory-server
  # тихо меняет версию бинаря, ключ кеша в .github/actions/setup её не
  # видит, и кеш продолжает отдавать старую версию мимо факта, что
  # скачивалась бы уже новая.
  MONGOMS_VERSION: '8.2.6'
  # Число шардов для матриц api-*/web-* — одно место, не магическое число в
  # каждой команде `--shard=N/…`. Меняешь дробление — правишь тут и в
  # соответствующем `matrix.shard` (GitHub Actions не даёт сгенерировать
  # список матрицы из env без отдельного шага, поэтому сам список остаётся
  # литералом `[1, 2]`/`[1, 2, 3]` в job, а знаменатель — отсюда).
  API_SHARDS: '2'
  WEB_SHARDS: '3'

# PR: новый пуш отменяет прошлый прогон той же ветки — раннеры не жгутся на
# устаревший код. main: у каждого коммита своя группа (sha) и свой прогон до
# конца — отменённый CI Railway «Wait for CI» пропускает на стейджинг, если на
# том же коммите прошёл любой другой workflow (release.yml, uptime.yml,
# backup.yml), а выкат на прод не может взять коммит без вердикта CI
# (ADR-0154, инцидент 2026-09-29).
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# По умолчанию Actions выдаёт GITHUB_TOKEN с правами на запись — джобам ниже
# он не нужен шире, чем на чтение репозитория.
permissions:
  contents: read

jobs:
  # Разносит долгие джобы api/web по фильтру путей: PR только в web/ (или
  # только в api/) не должен ждать тесты другой стороны. api и web друг о
  # друге не знают (CLAUDE.md, «Структура и слои» — держит eslint
  # no-restricted-imports), поэтому это безопасно. shared/, scripts/,
  # корневые конфиги, lock-файл и .github/ — общие, запускают обе стороны.
  # docs/*.md не запускает ни одну: у них нет своих проверок в api-*/web-*.
  # Общерепозиторные храповики (checks) и docker идут не по этому фильтру —
  # они смотрят весь репозиторий и должны падать при любом изменении.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          # На PR github.sha — это merge-коммит с базовой веткой, и
          # fetch-depth: 2 достаточно, чтобы получить его первого родителя
          # (HEAD^1 = актуальная голова базовой ветки): `git diff HEAD^1 HEAD`
          # покажет ровно то, что меняет сам PR относительно свежего main.
          fetch-depth: 2
      - name: какие файлы поменялись — решаем, какие джобы нужны
        id: filter
        shell: bash
        run: |
          # Push в main и ручной запуск — не PR, сравнивать не с чем: это и
          # есть то, что уедет в прод, гоняем обе стороны целиком.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "не pull_request (${{ github.event_name }}) — гоняем api и web целиком"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only HEAD^1 HEAD)
          echo "изменённые файлы PR:"
          echo "$files"

          api=false
          web=false
          if echo "$files" | grep -vE '^web/|^docs/|\.md$' | grep -q .; then
            api=true
          fi
          if echo "$files" | grep -vE '^api/|^docs/|\.md$' | grep -q .; then
            web=true
          fi

          echo "итог: api=$api web=$web"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  # Пояса гоняются в разных джобах одновременно (api-coverage — UTC с
  # покрытием, api-tz — Sydney) — это те же два прогона jest, что правило 1
  # CLAUDE.md требует, просто не друг за другом, а параллельно.
  # Шардинг (CLAUDE.md, критический путь CI): api-coverage/api-tz/api-e2e
  # были самыми долгими джобами — matrix режет каждую на N параллельных
  # раннеров вместо одного долгого прогона. Набор проверок тот же — jest
  # сам решает, какая часть тестов достаётся какому шарду (`--shard=k/N`),
  # ни один тест не пропускается и не дублируется.
  api-coverage:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          mongo: 'true'
          mongoms-version: ${{ env.MONGOMS_VERSION }}
      - name: typecheck (shared + api)
        if: matrix.shard == 1
        run: |
          npm run typecheck --workspace=shared
          npm run typecheck --workspace=api
      - name: shared vitest с покрытием
        if: matrix.shard == 1
        run: node scripts/check-vitest-coverage-ratchet.mjs shared
      - name: jest --coverage (сырое покрытие шарда — порог считает api-coverage-ratchet)
        working-directory: api
        run: npx jest --coverage --silent --coverageReporters=json --shard=${{ matrix.shard }}/${{ env.API_SHARDS }}
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage-${{ matrix.shard }}
          path: api/coverage/coverage-final.json
          retention-days: 1
          # Шард без файла покрытия — сбой, а не предупреждение: иначе порог
          # посчитался бы по части набора.
          if-no-files-found: error

  # Порог покрытия — по склеенному покрытию ВСЕГО набора (merge-coverage.mjs),
  # не по одному шарду: шард видит только свою часть, а храповик из CLAUDE.md
  # сравнивает целое с бейслайном.
  api-coverage-ratchet:
    needs: [changes, api-coverage]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build-shared: 'false'
      - name: скачать сырое покрытие всех шардов
        uses: actions/download-artifact@v4
        with:
          pattern: api-coverage-*
          path: coverage-parts
      - name: склеить покрытие шардов в summary
        run: node scripts/merge-coverage.mjs api/coverage/coverage-summary.json coverage-parts/*/coverage-final.json
      - name: coverage ratchet (по склеенному покрытию)
        run: node scripts/check-coverage-ratchet.mjs --summary=api/coverage/coverage-summary.json

  api-tz:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          mongo: 'true'
          mongoms-version: ${{ env.MONGOMS_VERSION }}
      - name: jest под TZ=Australia/Sydney (тест перехода летнего времени)
        run: TZ=Australia/Sydney npm test --workspace=api -- --shard=${{ matrix.shard }}/${{ env.API_SHARDS }}

  api-e2e:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          mongo: 'true'
          mongoms-version: ${{ env.MONGOMS_VERSION }}
      - name: e2e (реальный AppModule, ownership-смок)
        run: npm run test:e2e --workspace=api -- --shard=${{ matrix.shard }}/${{ env.API_SHARDS }}

  # Шардинг web-coverage/web-tz — тот же приём, что у api* выше: matrix
  # режет самую долгую джобу web (4:21) на параллельные раннеры.
  web-coverage:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: typecheck
        if: matrix.shard == 1
        run: npm run typecheck --workspace=web
      - name: vitest --coverage (сырое покрытие шарда — порог считает web-coverage-ratchet)
        working-directory: web
        # coverage.include в vite.config.ts уже задан, поэтому файлы без
        # тестов попадают в отчёт КАЖДОГО шарда (не только того, чей тест их
        # исполнил) — склейка равна покрытию полного прогона, а не отличается
        # на файлы без единого теста.
        run: npx vitest run --coverage --coverage.reporter=json --shard=${{ matrix.shard }}/${{ env.WEB_SHARDS }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-coverage-${{ matrix.shard }}
          path: web/coverage/coverage-final.json
          retention-days: 1
          # Шард без файла покрытия — сбой, а не предупреждение: иначе порог
          # посчитался бы по части набора.
          if-no-files-found: error

  web-coverage-ratchet:
    needs: [changes, web-coverage]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build-shared: 'false'
      - name: скачать сырое покрытие всех шардов
        uses: actions/download-artifact@v4
        with:
          pattern: web-coverage-*
          path: coverage-parts
      - name: склеить покрытие шардов в summary
        run: node scripts/merge-coverage.mjs web/coverage/coverage-summary.json coverage-parts/*/coverage-final.json
      - name: coverage ratchet (по склеенному покрытию)
        run: node scripts/check-vitest-coverage-ratchet.mjs web --summary=web/coverage/coverage-summary.json

  web-tz:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: vitest под TZ=Australia/Sydney (тест перехода летнего времени)
        run: TZ=Australia/Sydney npm run test --workspace=web -- --shard=${{ matrix.shard }}/${{ env.WEB_SHARDS }}

  web-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: vite build
        run: npm run build --workspace=web
      - name: pwa-гейт (манифест, иконки, заглушка service worker)
        run: node scripts/check-pwa.mjs
      - name: бюджет стартового JS (gzip)
        run: node scripts/check-bundle-size.mjs

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # gitleaks-action читает список коммитов PR через API — при глобальном
    # `contents: read` получает 403 «Resource not accessible by integration».
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks сканирует коммиты PR — без полной истории ему нечего сравнивать.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: route collisions
        run: node scripts/check-route-collisions.mjs
      - name: списки карточек — промежуток между строками задан
        run: node scripts/check-card-list-gap.mjs
      - name: запись + перечитывание — новых мест сверх аллоу-листа нет (ADR-0087)
        run: node scripts/check-write-then-reload.mjs
      - name: каждый контроллер закрыт e2e на отказ чужому (ADR-0106)
        run: node scripts/check-ownership-e2e.mjs
      - name: тесты что-то проверяют — без .only, .skip и пустых тел (ADR-0106)
        run: node scripts/check-test-assertions.mjs
      # Гейт завели 2026-09-22 (#392) против мигающих тестов на очереди
      # `…Once`, но в CI не внесли — он жил только в локальном `npm run check`,
      # и `main` успел разъехаться с бейслайном дважды (#399 пересчитал, #403
      # снова добавил две заглушки). Гейт, которого нет в CI, не гейт.
      - name: заглушки apiFetch не растут очередью `…Once`
        run: node scripts/check-once-mock-ratchet.mjs
      - name: вызовы в сеть с таймаутом (ADR-0106)
        run: node scripts/check-outbound-timeout.mjs
      - name: нумерация ADR — один номер, одно решение
        run: node scripts/check-adr-numbers.mjs
      # 2026-09-27 маркеры конфликта уехали в main в оглавлении ADR: prettier
      # переформатировал их в таблицу и цитату, и ни один гейт их не увидел.
      - name: маркеров конфликта слияния нет
        run: node scripts/check-conflict-markers.mjs
      - uses: ./.github/actions/setup
        with:
          # setup-node уже стоит отдельным шагом выше — ранним шагам без
          # npm ci он тоже был нужен (они запускаются `node`), но повторно
          # ставить Node.js тут незачем.
          setup-node: 'false'
          mongo: 'false'
          # typed eslint и knip резолвят @xuanxue/shared из shared/dist.
          build-shared: 'true'
      # Тесты храповиков стоят ПОСЛЕ `npm ci`: разбор текста для
      # check-text-accents.mjs идёт компилятором TypeScript (scripts/
      # text-accents-scan.mjs), и без установленных зависимостей его тест
      # падает на `Cannot find package 'typescript'` — так и вышло в первом
      # прогоне этого PR. Шагу, которому нужен пакет, место после установки;
      # остальные проверки выше зависимостей не требуют и остаются там,
      # чтобы падать на первых секундах.
      - name: тесты скриптов-храповиков (node:test)
        run: node --test scripts/*.test.mjs
      - name: сверка .env.example со всеми env, которые реально читает api
        run: node scripts/check-env-example.mjs
      - name: eslint ratchet
        run: node scripts/check-eslint-ratchet.mjs
      - name: jscpd ratchet
        run: node scripts/check-jscpd-ratchet.mjs
      - name: file-size ratchet
        run: node scripts/check-file-size-ratchet.mjs
      - name: robot-phrases ratchet
        run: node scripts/check-robot-phrases.mjs
      # Не голый `npm audit`: у уязвимости бывает нет исправленной версии, и
      # тогда красным становится каждый PR. Гейт умеет исключения с причиной и
      # сроком пересмотра — scripts/audit-allowlist.json.
      - name: npm audit (prod deps, high+)
        run: node scripts/check-npm-audit.mjs
      - name: prettier — формат всего репозитория
        run: npm run format:check
      - name: мёртвые экспорты shared/src/index.ts
        run: node scripts/check-shared-exports.mjs
      - name: типографские акценты в тексте пользователя
        run: node scripts/check-text-accents.mjs
      - name: knip — мёртвый код и неиспользуемые зависимости
        run: npx knip
      - name: gitleaks — секреты в диффе/истории
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    # Аналог джобы migrations из telegram-bot-2: Dockerfile и его env-контракт
    # (ValidationPipe/validateEnv, health-check) должны падать здесь, а не при
    # автодеплое на Railway. Образ собирает и api, и web (Nest раздаёт
    # web/dist) — гоняем, если задета любая сторона.
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - name: сборка docker-образа
        run: docker build -t xuanxue .
      - name: запуск контейнера (host-сеть — видит services.mongo на localhost)
        run: |
          ENC_KEY=$(printf '0%.0s' {1..64})
          # BOT_TOKEN и TELEGRAM_WEBHOOK_SECRET теперь обязательны в
          # production (env.validation.ts) — смок поднимает контейнер именно
          # как production, поэтому без них он не стартует. Значения
          # заведомо нерабочие (не настоящий токен бота), нужны только для
          # прохождения формата (BOT_TOKEN_RE / TELEGRAM_WEBHOOK_SECRET_RE).
          docker run -d --name xuanxue --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e MONGODB_URI=mongodb://127.0.0.1:27017/ci \
            -e ENCRYPTION_KEY="$ENC_KEY" \
            -e JWT_SECRET=ci-secret-ci-secret-ci-secret-1234 \
            -e PUBLIC_URL=http://localhost:3000 \
            -e BOT_TOKEN=1234567:ci-fake-value-for-smoke-only-0000 \
            -e TELEGRAM_WEBHOOK_SECRET=ci-fake-webhook-secret \
            -e SCHEDULER_ENABLED=true \
            -e RAILWAY_GIT_COMMIT_SHA="$GITHUB_SHA" \
            xuanxue
      # RUNBOOK §2 п.1: после деплоя commit должен совпадать с последним
      # коммитом main — здесь проверяем ту же связку version+commit, которую
      # Railway ставит по-настоящему через RAILWAY_GIT_COMMIT_SHA.
      - name: ждём /api/health и проверяем код 200, status=ok, mongo=up, commit
        run: |
          code=""
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /tmp/health.json -w '%{http_code}' http://localhost:3000/api/health) && break
            code=""
            sleep 1
          done
          if [ -z "$code" ]; then
            echo "::error::/api/health не ответил за 30 секунд"
            docker logs xuanxue
            exit 1
          fi
          cat /tmp/health.json
          node -e "
            const code = Number(process.argv[1]);
            const expectedCommit = process.argv[2].slice(0, 7);
            const h = require('/tmp/health.json');
            if (
              code !== 200 ||
              h.status !== 'ok' ||
              h.mongo !== 'up' ||
              h.commit !== expectedCommit
            ) {
              console.error('health-check вернул неожиданный код/тело:', code, h);
              process.exit(1);
            }
          " "$code" "$GITHUB_SHA"
      # PLAN §8 риск «Railway усыпляет сервис на дешёвом плане»: смок должен
      # ловить именно это, а не только то, что процесс поднялся. Тик — раз в
      # минуту (SchedulerService), поэтому ждём чуть больше минуты.
      - name: ждём тик планировщика (scheduler.tick в логах, PLAN §8)
        run: |
          found=""
          for i in $(seq 1 70); do
            if docker logs xuanxue 2>&1 | grep -q 'scheduler.tick'; then found=1; break; fi
            sleep 1
          done
          if [ -z "$found" ]; then
            echo "::error::scheduler.tick не появился в логах за 70 секунд — планировщик не тикает"
            docker logs xuanxue
            exit 1
          fi
      - name: логи контейнера
        if: always()
        run: docker logs xuanxue || true

  backup-restore:
    # Проверка scripts/backup-mongo.sh + scripts/restore-mongo.sh на каждом PR,
    # а не «раз в квартал по памяти» (CLAUDE.md, «Данные (MongoDB)»; RUNBOOK §7):
    # засеваем документы, бэкапим, восстанавливаем во вторую базу того же mongod,
    # сравниваем содержимое. Идёт всегда — данные и бэкапы не завязаны на
    # фильтр путей api/web.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      # Тестовая фраза только для CI-прогона, не секрет — реальная живёт в
      # GitHub Actions Secrets (.github/workflows/backup.yml, RUNBOOK §7).
      BACKUP_PASSPHRASE: ci-only-passphrase-not-a-real-secret
      SOURCE_URI: mongodb://127.0.0.1:27017/backuptest
      TARGET_URI: mongodb://127.0.0.1:27017/backuptest-restored
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build-shared: 'false'
      - name: mongodb-database-tools (mongodump/mongorestore)
        run: |
          VER=100.9.4
          curl -fsSL -o /tmp/tools.tgz \
            "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-${VER}.tgz"
          tar -xzf /tmp/tools.tgz -C /tmp
          sudo mv "/tmp/mongodb-database-tools-ubuntu2204-x86_64-${VER}/bin/"* /usr/local/bin/
      - name: засеять исходную базу
        run: node scripts/ci-backup-restore-check.mjs seed "$SOURCE_URI"
      - name: бэкап
        env:
          BACKUP_MONGODB_URI: ${{ env.SOURCE_URI }}
        run: ./scripts/backup-mongo.sh
      - name: восстановить во вторую базу
        run: |
          FILE=$(ls backups/*.archive.gz.enc)
          RESTORE_MONGODB_URI="$TARGET_URI" ./scripts/restore-mongo.sh "$FILE" --yes --from-db=backuptest
      - name: сравнить исходную и восстановленную базы
        run: node scripts/ci-backup-restore-check.mjs verify "$SOURCE_URI" "$TARGET_URI"
