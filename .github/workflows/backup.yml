name: Backup Mongo

# Раз в сутки — свой бэкап поверх Atlas M0, который бэкапы не делает
# (CLAUDE.md, «Данные (MongoDB)»; docs/RUNBOOK.md §7). 03:17 UTC — вне пиков
# нагрузки на бесплатный кластер, минута смещена от ровного часа, чтобы не
# попадать в одну секунду с чужими cron-джобами GitHub на *:00.
#
# Хранение — приватный бакет Cloudflare R2 в EU-юрисдикции (ADR-0152). Артефакты
# Actions публичного репозитория скачивает любой вошедший в GitHub, поэтому это
# только запасной путь на время, пока владелец не завёл бакет: тогда бэкап всё
# равно делается, но с предупреждением и напоминанием в Telegram каждую ночь.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # release.yml зовёт этот workflow перед каждым промоутом (ADR-0142,
  # ADR-0144) — свежий бэкап до сдвига release, не вместо суточного
  # расписания выше.
  workflow_call:
    secrets:
      BACKUP_MONGODB_URI:
        required: true
      BACKUP_PASSPHRASE:
        required: true
      TELEGRAM_ALERT_BOT_TOKEN:
        required: true
      TELEGRAM_ALERT_CHAT_ID:
        required: true
      # required: false — release.yml зовёт этот workflow с `secrets: inherit`, а
      # пока секретов нет, бэкап не должен падать: он уйдёт в артефакт (ADR-0152).
      BACKUP_R2_ENDPOINT:
        required: false
      BACKUP_R2_BUCKET:
        required: false
      BACKUP_R2_ACCESS_KEY_ID:
        required: false
      BACKUP_R2_SECRET_ACCESS_KEY:
        required: false

env:
  # Версия mongodb-database-tools закреплена явно — «латест» ломается без
  # предупреждения при следующем мажоре. Бампить руками при необходимости.
  MONGODB_TOOLS_VERSION: '100.9.4'

# Бэкап раз в сутки не должен идти параллельно второй раз (ручной запуск
# наложился на расписание) — второй прогон ждёт, а не пишет поверх.
concurrency:
  group: backup-mongo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Нужен только для алерта ниже (node scripts/notify-telegram.mjs) — сам
      # бэкап это bash/mongodump/openssl без Node.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: mongodb-database-tools (mongodump)
        run: |
          curl -fsSL -o /tmp/tools.tgz \
            "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-${MONGODB_TOOLS_VERSION}.tgz"
          tar -xzf /tmp/tools.tgz -C /tmp
          sudo mv "/tmp/mongodb-database-tools-ubuntu2204-x86_64-${MONGODB_TOOLS_VERSION}/bin/"* /usr/local/bin/
          mongodump --version

      - name: бэкап (scripts/backup-mongo.sh)
        env:
          # Секреты GitHub Actions, не переменные приложения — не входят в
          # .env.example и в api/src/config/env.validation.ts (RUNBOOK §7).
          BACKUP_MONGODB_URI: ${{ secrets.BACKUP_MONGODB_URI }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: ./scripts/backup-mongo.sh

      - name: путь к файлу бэкапа для следующего шага
        id: backup_file
        run: echo "path=$(ls backups/*.archive.gz.enc)" >> "$GITHUB_OUTPUT"

      # Куда класть файл, решает scripts/backup-destination.mjs (с тестом, который
      # заодно сверяет этот файл), а не шелл: все четыре секрета R2 заданы — target=r2,
      # иначе target=artifact. Значения секретов скрипт не печатает.
      - name: куда класть бэкап
        id: destination
        env:
          BACKUP_R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_FILE: ${{ steps.backup_file.outputs.path }}
        run: node scripts/backup-destination.mjs plan "$BACKUP_FILE"

      # Штатный путь: приватный бакет R2 (EU), артефакт не создаётся. Срок хранения
      # 90 дней держит правило жизненного цикла бакета (RUNBOOK §7.1), не код.
      # Упал aws s3 cp — упал шаг и весь прогон, алерт ниже: молча откатываться в
      # публичный артефакт нельзя. Контрольные суммы только «по требованию» —
      # рекомендация Cloudflare для новых версий AWS CLI, иначе R2 может отвергнуть
      # загрузку с расширенной контрольной суммой.
      - name: загрузить бэкап в приватный бакет R2
        if: steps.destination.outputs.target == 'r2'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BACKUP_R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          BACKUP_FILE: ${{ steps.backup_file.outputs.path }}
          BACKUP_KEY: ${{ steps.destination.outputs.key }}
        run: |
          aws --version
          aws s3 cp "$BACKUP_FILE" "s3://$BACKUP_R2_BUCKET/$BACKUP_KEY" \
            --endpoint-url "$BACKUP_R2_ENDPOINT" --no-progress

      # Запасной путь на время, пока R2 не настроен (ADR-0152). Файл зашифрован, но
      # лежит в публичном репозитории — поэтому следующий шаг шумит.
      - name: загрузить бэкап как artifact (запасной путь, R2 не настроен)
        if: steps.destination.outputs.target == 'artifact'
        uses: actions/upload-artifact@v7
        with:
          name: mongo-backup-${{ github.run_id }}
          path: ${{ steps.backup_file.outputs.path }}
          retention-days: 90

      # Напоминание владельцу, пока бэкапы едут в публичный артефакт: аннотация на
      # странице прогона + Telegram каждую ночь (тот же канал, что у алерта ниже).
      # shell: bash — pipefail, как в шаге алерта.
      - name: напомнить, что R2 для бэкапов не настроен
        if: steps.destination.outputs.target == 'artifact'
        shell: bash
        env:
          TELEGRAM_ALERT_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          BACKUP_R2_MISSING: ${{ steps.destination.outputs.missing }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/backup-destination.mjs warning
          node scripts/backup-destination.mjs notice | node scripts/notify-telegram.mjs

      # Упавший ночью бэкап раньше не доходил ни до кого (docs/adr/0111,
      # RUNBOOK §10.2) — тот же канал и скрипт, что у страховки uptime.yml.
      # shell: bash — тем же приёмом, что в uptime.yml: без него run: на
      # Linux — `bash -e {0}` без pipefail, и падение notify-telegram.mjs
      # слева от `|` не дошло бы до статуса шага (здесь не критично, см. его
      # комментарий про exit 0, но держим оба пайпа одинаково).
      - name: алерт в Telegram
        if: failure()
        shell: bash
        env:
          TELEGRAM_ALERT_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          {
            echo "Ночной бэкап Mongo упал — копии за эту ночь не будет."
            echo
            echo "Прогон: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | node scripts/notify-telegram.mjs
