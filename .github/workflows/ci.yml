name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '22'

# Один прогон на пуш/ветку — новый пуш отменяет предыдущий CI той же ветки.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# По умолчанию Actions выдаёт GITHUB_TOKEN с правами на запись — джобам ниже
# он не нужен шире, чем на чтение репозитория.
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: сборка shared (api и web резолвят @xuanxue/shared из shared/dist)
        run: npm run build --workspace=shared
      - name: typecheck (shared + api)
        run: |
          npm run typecheck --workspace=shared
          npm run typecheck --workspace=api
      - name: shared vitest
        run: npm run test --workspace=shared
      - name: coverage ratchet (runs jest --coverage)
        run: node scripts/check-coverage-ratchet.mjs
      - name: jest под TZ=Australia/Sydney (тест перехода летнего времени)
        run: TZ=Australia/Sydney npm test --workspace=api
      - name: e2e (реальный AppModule, ownership-смок)
        run: npm run test:e2e --workspace=api
      - name: сверка .env.example со всеми env, которые реально читает api
        run: node scripts/check-env-example.mjs
      - name: eslint ratchet
        run: node scripts/check-eslint-ratchet.mjs
      - name: jscpd ratchet
        run: node scripts/check-jscpd-ratchet.mjs
      - name: file-size ratchet
        run: node scripts/check-file-size-ratchet.mjs
      - name: robot-phrases ratchet
        run: node scripts/check-robot-phrases.mjs
      - name: npm audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: сборка shared (web резолвит @xuanxue/shared из shared/dist)
        run: npm run build --workspace=shared
      - name: typecheck
        run: npm run typecheck --workspace=web
      - name: vitest с покрытием
        run: npm run test:cov --workspace=web
      - name: vite build
        run: npm run build --workspace=web
      - name: pwa-гейт (манифест, иконки, service worker)
        run: node scripts/check-pwa.mjs
      - name: бюджет стартового JS (gzip)
        run: node scripts/check-bundle-size.mjs

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action читает список коммитов PR через API — при глобальном
    # `contents: read` получает 403 «Resource not accessible by integration».
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks сканирует коммиты PR — без полной истории ему нечего сравнивать.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: route collisions
        run: node scripts/check-route-collisions.mjs
      - run: npm ci
      - name: prettier — формат всего репозитория
        run: npm run format:check
      - name: knip — мёртвый код и неиспользуемые зависимости
        run: npx knip
      - name: gitleaks — секреты в диффе/истории
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    # Аналог джобы migrations из telegram-bot-2: Dockerfile и его env-контракт
    # (ValidationPipe/validateEnv, health-check) должны падать здесь, а не при
    # автодеплое на Railway.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - name: сборка docker-образа
        run: docker build -t xuanxue .
      - name: запуск контейнера (host-сеть — видит services.mongo на localhost)
        run: |
          ENC_KEY=$(printf '0%.0s' {1..64})
          docker run -d --name xuanxue --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e MONGODB_URI=mongodb://127.0.0.1:27017/ci \
            -e ENCRYPTION_KEY="$ENC_KEY" \
            -e JWT_SECRET=ci-secret-ci-secret-ci-secret-1234 \
            -e PUBLIC_URL=http://localhost:3000 \
            -e SCHEDULER_ENABLED=true \
            -e RAILWAY_GIT_COMMIT_SHA="$GITHUB_SHA" \
            xuanxue
      # RUNBOOK §2 п.1: после деплоя commit должен совпадать с последним
      # коммитом main — здесь проверяем ту же связку version+commit, которую
      # Railway ставит по-настоящему через RAILWAY_GIT_COMMIT_SHA.
      - name: ждём /api/health и проверяем код 200, status=ok, mongo=up, commit
        run: |
          code=""
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /tmp/health.json -w '%{http_code}' http://localhost:3000/api/health) && break
            code=""
            sleep 1
          done
          if [ -z "$code" ]; then
            echo "::error::/api/health не ответил за 30 секунд"
            docker logs xuanxue
            exit 1
          fi
          cat /tmp/health.json
          node -e "
            const code = Number(process.argv[1]);
            const expectedCommit = process.argv[2].slice(0, 7);
            const h = require('/tmp/health.json');
            if (
              code !== 200 ||
              h.status !== 'ok' ||
              h.mongo !== 'up' ||
              h.commit !== expectedCommit
            ) {
              console.error('health-check вернул неожиданный код/тело:', code, h);
              process.exit(1);
            }
          " "$code" "$GITHUB_SHA"
      # PLAN §8 риск «Railway усыпляет сервис на дешёвом плане»: смок должен
      # ловить именно это, а не только то, что процесс поднялся. Тик — раз в
      # минуту (SchedulerService), поэтому ждём чуть больше минуты.
      - name: ждём тик планировщика (scheduler.tick в логах, PLAN §8)
        run: |
          found=""
          for i in $(seq 1 70); do
            if docker logs xuanxue 2>&1 | grep -q 'scheduler.tick'; then found=1; break; fi
            sleep 1
          done
          if [ -z "$found" ]; then
            echo "::error::scheduler.tick не появился в логах за 70 секунд — планировщик не тикает"
            docker logs xuanxue
            exit 1
          fi
      - name: логи контейнера
        if: always()
        run: docker logs xuanxue || true

  backup-restore:
    # Проверка scripts/backup-mongo.sh + scripts/restore-mongo.sh на каждом PR,
    # а не «раз в квартал по памяти» (CLAUDE.md, «Данные (MongoDB)»; RUNBOOK §7):
    # засеваем документы, бэкапим, восстанавливаем во вторую базу того же mongod,
    # сравниваем содержимое.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      # Тестовая фраза только для CI-прогона, не секрет — реальная живёт в
      # GitHub Actions Secrets (.github/workflows/backup.yml, RUNBOOK §7).
      BACKUP_PASSPHRASE: ci-only-passphrase-not-a-real-secret
      SOURCE_URI: mongodb://127.0.0.1:27017/backuptest
      TARGET_URI: mongodb://127.0.0.1:27017/backuptest-restored
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: mongodb-database-tools (mongodump/mongorestore)
        run: |
          VER=100.9.4
          curl -fsSL -o /tmp/tools.tgz \
            "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-${VER}.tgz"
          tar -xzf /tmp/tools.tgz -C /tmp
          sudo mv "/tmp/mongodb-database-tools-ubuntu2204-x86_64-${VER}/bin/"* /usr/local/bin/
      - name: засеять исходную базу
        run: node scripts/ci-backup-restore-check.mjs seed "$SOURCE_URI"
      - name: бэкап
        env:
          BACKUP_MONGODB_URI: ${{ env.SOURCE_URI }}
        run: ./scripts/backup-mongo.sh
      - name: восстановить во вторую базу
        run: |
          FILE=$(ls backups/*.archive.gz.enc)
          RESTORE_MONGODB_URI="$TARGET_URI" ./scripts/restore-mongo.sh "$FILE" --yes --from-db=backuptest
      - name: сравнить исходную и восстановленную базы
        run: node scripts/ci-backup-restore-check.mjs verify "$SOURCE_URI" "$TARGET_URI"
